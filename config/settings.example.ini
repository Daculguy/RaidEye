# RaidEye local settings.
# Copy values into %LOCALAPPDATA%\RaidEye\settings.ini or use Open Config from the tray.

laptop_name=
arm_grace_seconds=5
poll_interval_ms=1000
trigger_once_per_arming=true
trigger_cooldown_seconds=300

# ntfy is the fastest iPhone notification prototype:
# 1. Install ntfy on iPhone.
# 2. Subscribe to the same topic.
# 3. Set ntfy_enabled=true and choose a random topic name.
ntfy_enabled=false
ntfy_base_url=https://ntfy.sh
ntfy_topic=
ntfy_bearer_token=

# Generic webhook prototype for Zapier, Make, IFTTT, Pipedream, custom SMS/email bridges, etc.
webhook_enabled=false
webhook_url=
webhook_header_name=
webhook_header_value=

notification_timeout_seconds=10

